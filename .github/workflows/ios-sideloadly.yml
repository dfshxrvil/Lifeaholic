name: Build iPhone IPA (Sideloadly)

on:
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: Days to keep the downloadable IPA
        required: false
        default: '14'
        type: choice
        options:
          - '7'
          - '14'
          - '30'

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify application code
        run: npm run verify

      - name: Verify iOS configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/Lifeaholic.xcworkspace/contents.xcworkspacedata
          test -f ios/Lifeaholic.xcodeproj/xcshareddata/xcschemes/Lifeaholic.xcscheme
          test -f ios/ExpoWidgetsTarget/LifeaholicTasksWidget.swift
          test -f ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements
          test -f ios/Lifeaholic/Lifeaholic.entitlements

          for widget in \
            LifeaholicDDayWidget \
            LifeaholicTasksWidget \
            LifeaholicMatrixWidget \
            LifeaholicWhatsNextWidget \
            LifeaholicAddExpenseWidget \
            LifeaholicFocusControllerWidget \
            LifeaholicFocusAnalyticsWidget; do
            grep -q "$widget()" ios/ExpoWidgetsTarget/index.swift
            grep -q "struct $widget: Widget" \
              ios/ExpoWidgetsTarget/LifeaholicTasksWidget.swift
          done

          # A web base path changes Metro's native asset destinations and can
          # collide with the Lifeaholic executable inside Lifeaholic.app.
          node - <<'NODE'
          const config = require('./app.config.js');
          const baseUrl = config?.expo?.experiments?.baseUrl;
          if (baseUrl) {
            throw new Error(`iOS builds must not define experiments.baseUrl (received ${baseUrl})`);
          }
          NODE

      - name: Install CocoaPods dependencies
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-logs"
          # The committed Podfile.lock predates the npm dependency update.
          pod update --no-repo-update 2>&1 | tee "$RUNNER_TEMP/ios-logs/pods.log"

      - name: Build iPhone release without Apple signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-logs"
          xcodebuild -version
          xcodebuild \
            -workspace ios/Lifeaholic.xcworkspace \
            -scheme Lifeaholic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LifeaholicDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            ENABLE_DEBUG_DYLIB=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-logs/xcodebuild.log"

      - name: Validate app and widget products
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LifeaholicDerivedData/Build/Products/Release-iphoneos/Lifeaholic.app"
          widget="$app/PlugIns/ExpoWidgetsTarget.appex"

          test -d "$app"
          test -x "$app/Lifeaholic"
          test -s "$app/main.jsbundle"
          test -d "$widget"
          test -x "$widget/ExpoWidgetsTarget"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget/Info.plist"

      - name: Package IPA for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LifeaholicDerivedData/Build/Products/Release-iphoneos/Lifeaholic.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/artifacts"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/Lifeaholic.app"
          app="$RUNNER_TEMP/ipa/Payload/Lifeaholic.app"

          # Temporary local signatures let re-signing tools inspect the bundles.
          # Sideloadly replaces these with signatures for the user's Apple ID.
          while IFS= read -r -d '' framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$app" -depth -type d -name '*.framework' -print0)
          while IFS= read -r -d '' library; do
            codesign --force --sign - --timestamp=none "$library"
          done < <(find "$app" -type f -name '*.dylib' -print0)
          codesign --force --sign - --timestamp=none \
            --entitlements ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements \
            "$app/PlugIns/ExpoWidgetsTarget.appex"
          codesign --force --sign - --timestamp=none \
            --entitlements ios/Lifeaholic/Lifeaholic.entitlements "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" 2>&1 \
            | grep -q 'group.com.example.lifeaholic'
          codesign -d --entitlements :- \
            "$app/PlugIns/ExpoWidgetsTarget.appex" 2>&1 \
            | grep -q 'group.com.example.lifeaholic'
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/artifacts/Lifeaholic-sideloadly.ipa" Payload
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/artifacts/Lifeaholic-sideloadly.ipa"

          # Confirm the final archive still contains the app, JavaScript bundle,
          # and widget extension after signing and packaging.
          archive_listing="$(/usr/bin/unzip -Z1 \
            "$GITHUB_WORKSPACE/artifacts/Lifeaholic-sideloadly.ipa")"
          grep -qx 'Payload/Lifeaholic.app/main.jsbundle' <<<"$archive_listing"
          grep -qx \
            'Payload/Lifeaholic.app/PlugIns/ExpoWidgetsTarget.appex/ExpoWidgetsTarget' \
            <<<"$archive_listing"

          shasum -a 256 "$GITHUB_WORKSPACE/artifacts/Lifeaholic-sideloadly.ipa" \
            > "$GITHUB_WORKSPACE/artifacts/Lifeaholic-sideloadly.ipa.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lifeaholic-sideloadly
          path: |
            artifacts/Lifeaholic-sideloadly.ipa
            artifacts/Lifeaholic-sideloadly.ipa.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload resolved native dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: ios/Podfile.lock
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-logs
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}
